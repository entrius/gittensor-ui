  <line x1="456" y1="80" x2="830" y2="80" stroke="#21262d" stroke-width="1"/>
  
  <text x="456" y="102" fill="#8b949e" font-size="12">#01</text>
  <text x="500" y="102" fill="#e6edf3" font-size="13">miner-alpha</text>

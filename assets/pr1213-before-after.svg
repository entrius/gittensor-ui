  <text x="668" y="104" fill="#3fb950" font-size="10">Eligible</text>
  
  <text x="456" y="128" fill="#8b949e" font-size="12">#02</text>
  <text x="500" y="128" fill="#e6edf3" font-size="13">miner-beta</text>
